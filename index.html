    <script>
      // Auto-purge any stale Service Worker or CARTO tile cache so Esri Street & Satellite Maps load cleanly
      (function () {
        try {
          var MIGRATION_KEY = 'arg3d_esri_streets_v4_clean';
          if (!localStorage.getItem(MIGRATION_KEY)) {
            localStorage.setItem(MIGRATION_KEY, 'true');
            if ('serviceWorker' in navigator) {
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                var hadSw = regs.length > 0;
                Promise.all(regs.map(function (r) { return r.unregister(); })).then(function () {
                  if ('caches' in window) {
                    caches.keys().then(function (keys) {
                      Promise.all(keys.map(function (k) { return caches.delete(k); })).then(function () {
                        if (hadSw) window.location.reload();
                      });
                    });
                  } else if (hadSw) {
                    window.location.reload();
                  }
                });
              });
            }
          }
        } catch (e) {}
      })();
    </script>
